@for (option of options(); track option.value) {
  <button
    type="button"
    class="ohno-lang-toggle__key"
    role="radio"
    [class.ohno-lang-toggle__key--on]="option.value === value()"
    [attr.aria-checked]="option.value === value()"
    (click)="valueChange.emit(option.value)"
  >
    {{ option.label }}
  </button>
}
