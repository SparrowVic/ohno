<ng-template #content>
  @if (led(); as ledColor) {
    <ohno-led class="ohno-key__led" [color]="ledColor" [on]="ledOn()" />
  }
  @if (icon(); as keyIcon) {
    <fa-icon class="ohno-key__icon" [icon]="keyIcon" />
  }
  @if (label(); as text) {
    <span class="ohno-key__label">{{ text }}</span>
  }
  @if (kbd(); as shortcut) {
    <ohno-kbd class="ohno-key__kbd">{{ shortcut }}</ohno-kbd>
  }
</ng-template>

@if (routerLink(); as link) {
  <a
    class="ohno-key"
    [class.ohno-key--icon-only]="iconOnly()"
    [attr.data-variant]="effectiveVariant()"
    [attr.data-size]="size()"
    [routerLink]="link"
    [queryParamsHandling]="queryParamsHandling()"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="titleText()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    (click)="onClick($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    class="ohno-key"
    [class.ohno-key--icon-only]="iconOnly()"
    [attr.data-variant]="effectiveVariant()"
    [attr.data-size]="size()"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="titleText()"
    [attr.aria-pressed]="pressed()"
    [attr.aria-haspopup]="menu() ? 'menu' : null"
    [attr.aria-expanded]="expanded()"
    [attr.role]="menuRole()"
    [attr.aria-checked]="checked()"
    (click)="onClick($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
