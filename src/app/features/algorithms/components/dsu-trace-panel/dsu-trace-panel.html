@if (state(); as dsuState) {
  @if (hintFacts().length > 0) {
    <ohno-trace-facts [facts]="hintFacts()" />
  }
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="statusFacts()" />
  <ohno-trace-table [title]="keys.currentSetsLabel" [meta]="setRows().length" [columns]="setColumns" [rows]="setRows()" />
  <ohno-trace-chips [title]="dsuState.operationsLabel" [meta]="edgeChips().length" [chips]="edgeChips()" />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="nodeRows().length"
    [columns]="nodeColumns"
    [rows]="nodeRows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
