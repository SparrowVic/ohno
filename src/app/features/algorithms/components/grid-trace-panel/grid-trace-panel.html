@if (state(); as gridState) {
  @if (hintFacts().length > 0) {
    <ohno-trace-facts [facts]="hintFacts()" />
  }
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="boardFacts()" />
  @if (gridState.frontierOrder) {
    <ohno-trace-chips
      [title]="keys.frontierLabel"
      [meta]="gridState.frontierOrder.length"
      [chips]="queueChips()"
      [emptyLabel]="commonKeys.emptyValueLabel"
    />
  }
  <ohno-trace-chips
    [title]="keys.visitOrderLabel"
    [meta]="gridState.visitOrder.length"
    [chips]="visitChips()"
    [emptyLabel]="keys.notStartedLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="rows().length"
    [columns]="columns"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
