<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaPlane | transloco: { count: view()?.sites?.length ?? 0 }"
  >
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="scene.grid" />

        @for (cell of scene.cells; track cell.id) {
          <polygon
            class="geo-poly"
            [attr.data-tone]="cell.active ? 'cyan' : 'lime'"
            [attr.data-strong]="cell.active"
            [attr.points]="cell.points"
          />
        }

        @if (scene.sweep; as sweep) {
          <line class="geo-sweep" [attr.x1]="sweep.x1" [attr.y1]="sweep.y" [attr.x2]="sweep.x2" [attr.y2]="sweep.y" />
          <text class="geo-label" data-tone="cyan" text-anchor="end" [attr.x]="sweep.x2 - 4" [attr.y]="sweep.y - 5">
            {{ sweep.label | i18nText }}
          </text>
        }

        @for (site of scene.sites; track site.id) {
          <g
            class="geo-point"
            [attr.data-tone]="site.tone"
            [attr.data-current]="site.current"
            [attr.transform]="'translate(' + site.x + ' ' + site.y + ')'"
          >
            <circle class="point__dot" [attr.r]="site.current ? 6 : 4.5" />
            <text class="point__id" [attr.x]="site.label.dx" [attr.y]="site.label.dy" [attr.text-anchor]="site.label.anchor">{{ site.id }}</text>
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack class="geo-racks__fill" [title]="RACKS.events" [meta]="scene.eventMeta" [rows]="scene.eventRows" />
    }
  </div>
</div>
