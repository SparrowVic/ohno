<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaPlane | transloco: { count: view()?.points?.length ?? 0 }"
  >
    @if (view(); as hull) {
      <svg class="plane__svg" [attr.viewBox]="hull.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="hull.grid" />

        @if (hull.hullPolygon; as polygon) {
          <polygon class="geo-poly" data-tone="lime" data-strong="true" [attr.points]="polygon" />
        }
        @if (hull.stackPath; as path) {
          <polyline class="geo-line" data-tone="lime" data-weight="bold" [attr.points]="path" />
        }
        @if (hull.checkPath; as path) {
          <polyline class="geo-line" data-tone="cyan" data-dash="true" data-weight="bold" [attr.points]="path" />
        }
        @if (hull.checkArc; as arc) {
          <path class="geo-line" data-tone="cyan" [attr.d]="arc" />
        }

        @for (point of hull.points; track point.id) {
          <g
            class="geo-point"
            [attr.data-tone]="point.tone"
            [attr.data-current]="point.current"
            [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'"
          >
            @if (point.rejected) {
              <circle class="geo-reject" r="5.5" />
              <path class="geo-reject" d="M -3.2 -3.2 L 3.2 3.2 M -3.2 3.2 L 3.2 -3.2" />
            } @else {
              <circle class="point__dot" [attr.r]="point.current ? 6 : 4.5" />
            }
            <text class="point__id" [attr.x]="point.label.dx" [attr.y]="point.label.dy" [attr.text-anchor]="point.label.anchor">{{ point.id }}</text>
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as hull) {
      <app-geo-rack
        class="geo-racks__fill"
        [title]="RACKS.stack"
        [meta]="RACKS.topUp"
        [rows]="hull.stackRows"
        [empty]="NOTES.empty"
      />
      <app-geo-readout [view]="hull.readout" />
    }
  </div>
</div>
