<div class="display display--rack">
  <div #plane class="display__main plane" role="img" [attr.aria-label]="GEO.ariaMinkowski | transloco">
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="scene.grid" />

        @for (shape of scene.shapes; track shape.id) {
          <polygon
            class="geo-poly"
            [attr.data-tone]="shape.tone"
            [attr.data-strong]="shape.strong"
            [attr.data-dash]="shape.dashed"
            [attr.data-hollow]="shape.hollow"
            [attr.points]="shape.points"
          />
        }

        @if (scene.path; as path) {
          <polyline class="geo-line" data-tone="lime" data-weight="bold" [attr.points]="path" />
        }

        @for (shape of scene.shapes; track shape.id) {
          <text class="geo-label" text-anchor="middle" [attr.data-tone]="shape.tone" [attr.x]="shape.labelX" [attr.y]="shape.labelY">
            {{ shape.label }}
          </text>
        }

        @for (vertex of scene.vertices; track vertex.id) {
          <g
            class="geo-point"
            [attr.data-tone]="vertex.current ? 'cyan' : 'lime'"
            [attr.data-current]="vertex.current"
            [attr.transform]="'translate(' + vertex.x + ' ' + vertex.y + ')'"
          >
            <circle class="point__dot" [attr.r]="vertex.current ? 5.5 : 3.5" />
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack
        class="geo-racks__fill"
        [title]="RACKS.vectors"
        [meta]="scene.vectorMeta"
        [rows]="scene.vectorRows"
        [empty]="NOTES.empty"
      />
    }
  </div>
</div>
