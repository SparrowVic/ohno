@if (state(); as geo) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="eventFacts()" />
  <ohno-trace-chips
    [title]="keys.activeOrderingLabel"
    [meta]="geo.activeOrder.length"
    [chips]="orderChips()"
    [emptyLabel]="keys.noActiveSegmentsLabel"
  />
  <ohno-trace-chips
    [title]="keys.upcomingQueueLabel"
    [meta]="upcomingChips().length"
    [chips]="upcomingChips()"
    [emptyLabel]="keys.noQueuedEventsLabel"
  />
  <ohno-trace-table
    [title]="keys.foundIntersectionsLabel"
    [meta]="geo.intersections.length"
    [columns]="intersectionColumns"
    [rows]="intersectionRows()"
    [emptyLabel]="keys.noConfirmedIntersectionsLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
