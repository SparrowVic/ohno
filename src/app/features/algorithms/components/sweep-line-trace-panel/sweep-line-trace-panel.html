@if (state(); as geo) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-table
    [title]="keys.activeMergedSpansLabel"
    [meta]="geo.spans.length"
    [columns]="spanColumns"
    [rows]="spanRows()"
    [emptyLabel]="keys.noActiveSpansLabel"
  />
  <ohno-trace-chips
    [title]="keys.eventQueueLabel"
    [meta]="geo.events.length"
    [chips]="eventChips()"
    [emptyLabel]="keys.noQueuedEventsLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
