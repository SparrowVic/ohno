@if (state(); as lab) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-table
    [title]="keys.registersLabel"
    [meta]="lab.registers.length"
    [columns]="registerColumns"
    [rows]="registerRows()"
  />
  <ohno-trace-chips
    [title]="keys.historyLabel"
    [meta]="lab.history.length"
    [chips]="historyChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
