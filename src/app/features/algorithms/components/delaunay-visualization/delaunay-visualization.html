<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaPlane | transloco: { count: view()?.points?.length ?? 0 }"
  >
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <defs>
          <clipPath [attr.id]="clipId">
            <rect [attr.x]="scene.clip.x" [attr.y]="scene.clip.y" [attr.width]="scene.clip.width" [attr.height]="scene.clip.height" />
          </clipPath>
        </defs>

        <g appGeoGraticule [grid]="scene.grid" />

        @for (triangle of scene.triangles; track triangle.id) {
          <polygon
            class="geo-poly"
            [attr.data-tone]="triangle.current ? 'cyan' : 'lime'"
            [attr.data-dash]="triangle.current"
            [attr.points]="triangle.points"
          />
        }

        @for (edge of scene.edges; track edge.id) {
          <line class="geo-line" data-tone="lime" [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2" />
        }

        <g [attr.clip-path]="'url(#' + clipId + ')'">
          @for (circle of scene.circles; track circle.id) {
            <circle class="geo-line" data-tone="cyan" data-dash="true" [attr.cx]="circle.cx" [attr.cy]="circle.cy" [attr.r]="circle.r" />
            <circle class="geo-center" [attr.cx]="circle.cx" [attr.cy]="circle.cy" r="2.5" />
          }
        </g>

        @for (circle of scene.circles; track circle.id) {
          <g class="geo-chip" data-tone="cyan" [attr.transform]="'translate(' + circle.cx + ' ' + (circle.cy - 14) + ')'">
            <rect class="chip__box" [attr.x]="-circle.chipWidth / 2" y="-8" [attr.width]="circle.chipWidth" height="16" />
            <text class="chip__text">{{ circle.chip }}</text>
          </g>
        }

        @for (point of scene.points; track point.id) {
          <g class="geo-point" [attr.data-tone]="point.tone" [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'">
            <circle class="point__dot" r="4.5" />
            <text class="point__id" x="8" y="-8">{{ point.id }}</text>
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack class="geo-racks__fill" [title]="RACKS.triangles" [meta]="scene.eventMeta" [rows]="scene.eventRows" />
    }
  </div>
</div>
