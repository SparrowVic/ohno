@if (state()) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [title]="keys.calculationAriaLabel" [facts]="calculationFacts()" />
  @if (insightFacts().length > 0) {
    <ohno-trace-facts [title]="keys.insightsLabel" [meta]="insightFacts().length" [facts]="insightFacts()" />
  }
  @for (section of sections(); track section.id) {
    @if (section.facts; as facts) {
      <ohno-trace-facts [title]="section.title" [meta]="section.meta ?? null" [facts]="facts" />
    }
    @if (section.chips; as chips) {
      <ohno-trace-chips
        [title]="section.title"
        [meta]="section.meta ?? null"
        [chips]="chips"
        [emptyLabel]="section.emptyLabel ?? null"
      />
    }
  }
  <ohno-trace-chips [title]="keys.legendLabel" [chips]="legendChips" />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
