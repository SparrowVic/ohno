<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaConstraints | transloco: { count: view()?.constraints?.length ?? 0 }"
  >
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <defs>
          <clipPath [attr.id]="clipId">
            <rect [attr.x]="scene.grid.plot.x" [attr.y]="scene.grid.plot.y" [attr.width]="scene.grid.plot.width" [attr.height]="scene.grid.plot.height" />
          </clipPath>
        </defs>

        <g appGeoGraticule [grid]="scene.grid" />

        <g [attr.clip-path]="'url(#' + clipId + ')'">
          @for (region of scene.regions; track region.id) {
            <polygon
              class="geo-poly"
              [attr.data-tone]="region.tone"
              [attr.data-strong]="region.strong"
              [attr.data-dash]="region.dashed"
              [attr.data-hollow]="region.hollow"
              [attr.points]="region.points"
            />
          }

          @for (constraint of scene.constraints; track constraint.id) {
            <line
              class="geo-line"
              [attr.data-tone]="constraint.tone"
              [attr.data-weight]="constraint.bold ? 'bold' : null"
              [attr.data-dash]="constraint.dashed"
              [attr.x1]="constraint.x1"
              [attr.y1]="constraint.y1"
              [attr.x2]="constraint.x2"
              [attr.y2]="constraint.y2"
            />
          }
        </g>

        @for (constraint of scene.constraints; track constraint.id) {
          <text class="geo-label" [attr.data-tone]="constraint.tone" [attr.x]="constraint.labelX" [attr.y]="constraint.labelY">
            {{ constraint.label }}
          </text>
        }

        @for (vertex of scene.vertices; track vertex.id) {
          <g class="geo-point" data-tone="lime" [attr.transform]="'translate(' + vertex.x + ' ' + vertex.y + ')'">
            <circle class="point__dot" r="3.5" />
            <text class="point__id" x="6" y="-6">{{ vertex.label }}</text>
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack
        class="geo-racks__fill"
        [title]="RACKS.constraints"
        [meta]="scene.constraintMeta"
        [rows]="scene.constraintRows"
      />
    }
  </div>
</div>
