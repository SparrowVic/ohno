@if (state(); as pad) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  @if (currentFacts().length > 0) {
    <ohno-trace-facts [title]="keys.currentLineLabel" [facts]="currentFacts()" />
  }
  @if (marginChips().length > 0) {
    <ohno-trace-chips [title]="keys.marginsLabel" [meta]="pad.margins.length" [chips]="marginChips()" />
  }
  <ohno-trace-table
    [title]="keys.historyLabel"
    [meta]="historyRows().length"
    [columns]="historyColumns"
    [rows]="historyRows()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
