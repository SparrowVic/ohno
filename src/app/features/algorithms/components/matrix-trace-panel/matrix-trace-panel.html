@if (state(); as matrixState) {
  @if (hintFacts().length > 0) {
    <ohno-trace-facts [facts]="hintFacts()" />
  }
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="operationFacts()" />
  <ohno-trace-chips
    [title]="focusTitle()"
    [meta]="matrixState.focusItems.length"
    [chips]="focusChips()"
    [emptyLabel]="commonKeys.noneYetLabel"
  />
  <ohno-trace-chips
    [title]="secondaryTitle()"
    [meta]="matrixState.secondaryItems.length"
    [chips]="secondaryChips()"
    [emptyLabel]="commonKeys.noneYetLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="rows().length"
    [columns]="columns"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
