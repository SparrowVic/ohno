@if (state(); as geo) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-chips
    [title]="keys.mergeRailLabel"
    [meta]="geo.events.length"
    [chips]="eventChips()"
    [emptyLabel]="keys.noQueuedMergeStepsLabel"
  />
  <ohno-trace-table
    [title]="keys.activeVectorsLabel"
    [meta]="vectorRows().length"
    [columns]="vectorColumns"
    [rows]="vectorRows()"
    [emptyLabel]="keys.waitingForVectorsLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
