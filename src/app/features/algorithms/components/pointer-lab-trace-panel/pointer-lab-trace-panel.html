@if (state(); as lab) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-chips [title]="keys.pointersLabel" [meta]="lab.pointers.length" [chips]="pointerChips()" />
  @if (statFacts().length > 0) {
    <ohno-trace-facts [title]="keys.statsLabel" [meta]="lab.stats.length" [facts]="statFacts()" />
  }
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
