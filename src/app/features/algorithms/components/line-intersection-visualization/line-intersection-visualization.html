<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaSegments | transloco: { count: view()?.segments?.length ?? 0 }"
  >
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="scene.grid" />

        @if (scene.sweep; as sweep) {
          <line class="geo-sweep" [attr.x1]="sweep.x" [attr.y1]="sweep.y1" [attr.x2]="sweep.x" [attr.y2]="sweep.y2" />
          <text class="geo-label" data-tone="cyan" text-anchor="middle" [attr.x]="sweep.x" [attr.y]="sweep.y1 - 4">
            {{ sweep.label | i18nText }}
          </text>
        }

        @for (segment of scene.segments; track segment.id) {
          <g class="geo-point" [attr.data-tone]="segment.tone">
            <line
              class="geo-line"
              [attr.data-tone]="segment.tone"
              [attr.data-weight]="segment.bold ? 'bold' : null"
              [attr.x1]="segment.x1"
              [attr.y1]="segment.y1"
              [attr.x2]="segment.x2"
              [attr.y2]="segment.y2"
            />
            <circle class="point__dot" r="3" [attr.cx]="segment.x1" [attr.cy]="segment.y1" />
            <circle class="point__dot" r="3" [attr.cx]="segment.x2" [attr.cy]="segment.y2" />
            <text class="point__id" text-anchor="end" [attr.x]="segment.x1 - 7" [attr.y]="segment.y1 + 3">{{ segment.label }}</text>
          </g>
        }

        @for (crossing of scene.crossings; track crossing.id) {
          <g
            class="geo-point"
            [attr.data-tone]="crossing.tone"
            [attr.data-current]="crossing.current"
            [attr.transform]="'translate(' + crossing.x + ' ' + crossing.y + ')'"
          >
            <circle class="point__dot" [attr.r]="crossing.current ? 6 : 4.5" />
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack class="geo-racks__fill" [title]="RACKS.events" [meta]="scene.eventMeta" [rows]="scene.eventRows" />
      <app-geo-rack class="geo-racks__part" [title]="GEO.activeOrder" [rows]="scene.orderRows" [empty]="NOTES.empty" />
    }
  </div>
</div>
