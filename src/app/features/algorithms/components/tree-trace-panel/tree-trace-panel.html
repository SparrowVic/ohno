@if (state(); as tree) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="decisionFacts()" />
  <ohno-trace-chips
    [title]="usesQueue() ? keys.queueLabel : keys.stackLabel"
    [meta]="frontierChips().length"
    [chips]="frontierChips()"
    [emptyLabel]="commonKeys.emptyValueLabel"
  />
  <ohno-trace-chips
    [title]="keys.outputLabel"
    [meta]="tree.visitedCount"
    [chips]="outputChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
