@if (state(); as stack) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  @if (frameFacts().length > 0) {
    <ohno-trace-facts [facts]="frameFacts()" />
    @if (localChips().length > 0) {
      <ohno-trace-chips [chips]="localChips()" />
    }
  }
  <ohno-trace-facts [title]="keys.statsLabel" [meta]="stack.stats.length" [facts]="statFacts()" />
  <ohno-trace-chips
    [title]="keys.returnsLabel"
    [meta]="stack.recentReturns.length"
    [chips]="returnChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
