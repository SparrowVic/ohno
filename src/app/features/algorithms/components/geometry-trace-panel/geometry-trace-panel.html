@if (state(); as geo) {
  <ohno-trace-facts [title]="TRACE.summaryAria" [facts]="summaryFacts()" />
  <section class="trace-panel__section">
    <h3 class="trace-panel__title"><ohno-engraving>{{ TRACE.crossCheck | transloco }}</ohno-engraving></h3>
    <p class="trace-panel__formula"><app-math-text [tex]="crossProductFormula" variant="formula" /></p>
    @if (showTurnDetails()) {
      <ohno-trace-table [title]="TRACE.turnTitle" [columns]="turnColumns" [rows]="turnRows()" />
      <ohno-trace-facts [facts]="verdictFacts()" />
    } @else {
      <p class="trace-panel__note">{{ TRACE.turnHint | transloco }}</p>
    }
  </section>
  <ohno-trace-table
    [title]="TRACE.hullStack"
    [meta]="geo.stackIds.length"
    [columns]="stackColumns"
    [rows]="stackRows()"
    [emptyLabel]="TRACE.stackEmpty"
  />
  <ohno-trace-chips [title]="TRACE.pointStatus" [chips]="legendChips" />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ TRACE.empty | transloco }}</p>
}
