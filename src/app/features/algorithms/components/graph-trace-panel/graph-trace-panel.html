@if (state(); as graphState) {
  @if (hintFacts().length > 0) {
    <ohno-trace-facts [facts]="hintFacts()" />
  }
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [title]="keys.currentDecisionLabel" [facts]="decisionFacts()" />
  <ohno-trace-facts [title]="keys.contextLabel" [facts]="contextFacts()" />
  <ohno-trace-chips
    [title]="frontierLabel()"
    [meta]="graphState.queue.length"
    [chips]="queueChips()"
    [emptyLabel]="commonKeys.emptyValueLabel"
  />
  <ohno-trace-chips
    [title]="visitOrderLabel()"
    [meta]="graphState.visitOrder.length"
    [chips]="visitChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="graphState.traceRows.length"
    [columns]="columns()"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
