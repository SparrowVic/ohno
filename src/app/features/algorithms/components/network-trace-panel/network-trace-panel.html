@if (state(); as networkState) {
  @if (hintFacts().length > 0) {
    <ohno-trace-facts [facts]="hintFacts()" />
  }
  <ohno-trace-facts [facts]="summaryFacts()" />
  <ohno-trace-facts [facts]="stepFacts()" />
  <ohno-trace-chips
    [title]="queueTitle()"
    [meta]="networkState.queue.length"
    [chips]="queueChips()"
    [emptyLabel]="keys.queueEmptyLabel"
  />
  <ohno-trace-chips
    [title]="focusTitle()"
    [meta]="networkState.focusItems.length"
    [chips]="focusChips()"
    [emptyLabel]="commonKeys.noneYetLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="rows().length"
    [columns]="columns()"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
