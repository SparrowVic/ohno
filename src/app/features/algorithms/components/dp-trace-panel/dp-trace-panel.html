@if (state(); as dpState) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [title]="keys.calculationAriaLabel" [facts]="calculationFacts()" />
  <ohno-trace-chips
    [title]="dpState.primaryItemsLabel"
    [meta]="dpState.primaryItems.length"
    [chips]="primaryChips()"
    [emptyLabel]="commonKeys.noneLabel"
  />
  <ohno-trace-chips
    [title]="dpState.secondaryItemsLabel"
    [meta]="dpState.secondaryItems.length"
    [chips]="secondaryChips()"
    [emptyLabel]="commonKeys.noneLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="dpState.dimensionsLabel"
    [columns]="columns"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
