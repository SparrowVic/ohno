@if (state(); as geo) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-chips
    [title]="keys.constraintRailLabel"
    [meta]="geo.events.length"
    [chips]="eventChips()"
    [emptyLabel]="keys.noQueuedConstraintsLabel"
  />
  <ohno-trace-table
    [title]="keys.feasibleVerticesLabel"
    [meta]="feasiblePolygon()?.vertices?.length ?? 0"
    [columns]="vertexColumns"
    [rows]="vertexRows()"
  />
  <p class="trace-panel__note">
    {{ (feasiblePolygon() ? keys.verticesUpdateLabel : keys.polygonEmptyLabel) | transloco }}
  </p>
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
