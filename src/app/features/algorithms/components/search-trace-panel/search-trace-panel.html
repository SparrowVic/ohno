@if (state(); as searchState) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [title]="keys.calculationAriaLabel" [facts]="calculationFacts()" />
  <ohno-trace-chips
    [title]="keys.visitedOrderLabel"
    [meta]="searchState.visitedOrder.length"
    [chips]="visitedChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
  <ohno-trace-chips
    [title]="keys.matchSpanLabel"
    [meta]="searchState.resultIndices.length"
    [chips]="hitChips()"
    [emptyLabel]="keys.noConfirmedHitsLabel"
  />
  <ohno-trace-table
    [title]="keys.tableTitle"
    [meta]="searchState.rows.length"
    [columns]="columns"
    [rows]="rows()"
    [emptyLabel]="keys.tableEmptyLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
