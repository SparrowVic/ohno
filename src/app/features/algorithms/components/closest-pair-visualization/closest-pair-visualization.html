<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaPlane | transloco: { count: view()?.points?.length ?? 0 }"
  >
    @if (view(); as pair) {
      <svg class="plane__svg" [attr.viewBox]="pair.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="pair.grid" />

        @for (band of pair.bands; track band.id) {
          <rect
            class="geo-poly"
            [attr.data-tone]="band.tone"
            [attr.data-hollow]="band.hollow"
            [attr.data-dash]="band.hollow"
            [attr.x]="band.x"
            [attr.y]="band.y"
            [attr.width]="band.width"
            [attr.height]="band.height"
          />
        }

        @for (divider of pair.dividers; track divider.id) {
          <line
            class="geo-line"
            data-dash="true"
            [attr.data-tone]="divider.tone"
            [attr.x1]="divider.x"
            [attr.y1]="divider.y1"
            [attr.x2]="divider.x"
            [attr.y2]="divider.y2"
          />
          <text class="geo-label" text-anchor="middle" [attr.data-tone]="divider.tone" [attr.x]="divider.x" [attr.y]="divider.y1 - 4">
            {{ divider.label | i18nText }}
          </text>
        }

        @for (line of pair.pairs; track line.id) {
          <line
            class="geo-line"
            data-weight="bold"
            [attr.data-tone]="line.tone"
            [attr.data-dash]="line.dashed"
            [attr.x1]="line.x1"
            [attr.y1]="line.y1"
            [attr.x2]="line.x2"
            [attr.y2]="line.y2"
          />
          <g class="geo-chip" [attr.data-tone]="line.tone" [attr.transform]="'translate(' + line.chipX + ' ' + line.chipY + ')'">
            <rect class="chip__box" [attr.x]="-line.chipWidth / 2" y="-8" [attr.width]="line.chipWidth" height="16" />
            <text class="chip__text">{{ line.distance }}</text>
          </g>
        }

        @for (point of pair.points; track point.id) {
          <g
            class="geo-point"
            [attr.data-tone]="point.tone"
            [attr.data-current]="point.current"
            [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'"
          >
            <circle class="point__dot" [attr.r]="point.current ? 6 : 4.5" />
            <text class="point__id" x="8" y="-8">{{ point.id }}</text>
          </g>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as pair) {
      <app-geo-readout [view]="pair.readout" />
      <app-geo-rack class="geo-racks__fill" [title]="GEO.closestPair.recursion" [rows]="pair.trailRows" />
    }
  </div>
</div>
