@if (state(); as geo) {
  <ohno-trace-facts [title]="keys.summaryAriaLabel" [facts]="summaryFacts()" />
  <ohno-trace-facts [title]="keys.circumcircleLabel" [facts]="circleFacts()" />
  <ohno-trace-chips
    [title]="keys.triangleRailLabel"
    [meta]="geo.events.length"
    [chips]="eventChips()"
    [emptyLabel]="keys.noQueuedTrianglesLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
