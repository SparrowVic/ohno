@if (state(); as tree) {
  <ohno-trace-facts [facts]="summaryFacts()" />
  @if (nodeFacts().length > 0) {
    <ohno-trace-facts [facts]="nodeFacts()" />
    @if (nodeStatFacts().length > 0) {
      <ohno-trace-facts [facts]="nodeStatFacts()" />
    }
  }
  <ohno-trace-facts [title]="keys.statsLabel" [meta]="tree.stats.length" [facts]="statFacts()" />
  <ohno-trace-chips
    [title]="keys.pathLabel"
    [meta]="tree.activePath.length"
    [chips]="pathChips()"
    [emptyLabel]="commonKeys.notStartedLabel"
  />
} @else {
  <p class="trace-panel__empty"><ohno-led color="slate" [on]="false" size="sm" />{{ keys.emptyLabel | transloco }}</p>
}
