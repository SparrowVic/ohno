<div class="display display--rack">
  <div
    #plane
    class="display__main plane"
    role="img"
    [attr.aria-label]="GEO.ariaRects | transloco: { count: view()?.rects?.length ?? 0 }"
  >
    @if (view(); as scene) {
      <svg class="plane__svg" [attr.viewBox]="scene.grid.viewBox" aria-hidden="true">
        <g appGeoGraticule [grid]="scene.grid" />

        @if (scene.covered; as covered) {
          <rect class="geo-swept" [attr.x]="covered.x" [attr.y]="covered.y" [attr.width]="covered.width" [attr.height]="covered.height" />
        }

        @for (rect of scene.rects; track rect.id) {
          <rect
            class="geo-poly"
            [attr.data-tone]="rect.tone"
            [attr.data-strong]="rect.strong"
            [attr.data-dash]="rect.dashed"
            [attr.x]="rect.x"
            [attr.y]="rect.y"
            [attr.width]="rect.width"
            [attr.height]="rect.height"
          />
          <text class="geo-label" [attr.data-tone]="rect.tone" [attr.x]="rect.x + 5" [attr.y]="rect.y + 13">{{ rect.label }}</text>
        }

        @if (scene.sweep; as sweep) {
          <line class="geo-sweep" [attr.x1]="sweep.x" [attr.y1]="sweep.y1" [attr.x2]="sweep.x" [attr.y2]="sweep.y2" />
          @for (span of scene.spans; track span.id) {
            <line class="geo-line" data-tone="lime" data-weight="heavy" [attr.x1]="sweep.x" [attr.y1]="span.y1" [attr.x2]="sweep.x" [attr.y2]="span.y2" />
          }
          <text class="geo-label" data-tone="cyan" text-anchor="middle" [attr.x]="sweep.x" [attr.y]="sweep.y1 - 4">
            {{ sweep.label | i18nText }}
          </text>
        }
      </svg>
    }
  </div>

  <div class="display__rack geo-racks" aria-hidden="true">
    @if (view(); as scene) {
      <app-geo-readout [view]="scene.readout" />
      <app-geo-rack class="geo-racks__fill" [title]="RACKS.events" [meta]="scene.eventMeta" [rows]="scene.eventRows" />
      <app-geo-rack class="geo-racks__part" [title]="RACKS.spans" [rows]="scene.spanRows" [empty]="NOTES.empty" />
    }
  </div>
</div>
